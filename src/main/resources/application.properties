spring.application.name=CoGoal-main

spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/db.changelog-master.xml

# Bearer token validation (tokens are issued by the auth service, signed with HS256)
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:cogoal-auth}
security.jwt.audience=${JWT_AUDIENCE:cogoal-main}
security.jwt.clock-skew=30s

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
